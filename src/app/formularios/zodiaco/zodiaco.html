<div class="max-w-2xl p-6 mx-auto bg-white rounded-lg shadow">
    <h1 class="mb-6 text-3xl font-bold text-gray-900">Datos Personales</h1>
    <form class="max-w-sm mx-auto" [formGroup]="formulario">
        <div class="mb-5">
            <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">Nombre</label>
            <input
                formControlName="nombre" type="text" id="nombre" name="nombre"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                placeholder="Escribe tu nombre">
            <label for="Apaterno" class="block mb-2 text-sm font-medium text-gray-900">Apellido Paterno</label>
            <input
                formControlName="Apaterno"
                type="text"
                id="Apaterno"
                name="Apaterno"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                placeholder="Escribe tu apellido paterno">
            <label for="Amaterno" class="block mb-2 text-sm font-medium text-gray-900">Apellido Materno</label>
            <input
                formControlName="Amaterno"
                type="text"
                id="Amaterno"
                name="Amaterno"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                placeholder="Escribe tu apellido materno">
            <h3 class="mt-5 mb-3 text-lg font-medium text-gray-900">Fecha de nacimiento</h3>
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label for="dia" class="block mb-2 text-sm font-medium text-gray-900">Día</label>
                    <input
                        formControlName="dia"
                        type="number"
                        id="dia"
                        min="1"
                        max="31"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                        focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                        placeholder="Día">
                </div>
                <div>
                    <label for="mes" class="block mb-2 text-sm font-medium text-gray-900">Mes</label>
                    <input
                        formControlName="mes"
                        type="number"
                        id="mes"
                        min="1"
                        max="12"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                        focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                        placeholder="Mes">
                </div>
                <div>
                    <label for="ano" class="block mb-2 text-sm font-medium text-gray-900">Año</label>
                    <input
                        formControlName="ano"
                        type="number"
                        id="ano"
                        min="1990"
                        max="2026"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                        focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                        placeholder="Año">
                </div>
            </div>
            <h3 class="mt-5 mb-3 text-lg font-medium text-gray-900">Sexo</h3>
            <div class="flex items-center mb-3">
                <input
                    formControlName="sexo"
                    type="radio"
                    name="sexo"
                    id="femenino"
                    value="Femenino"
                    class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300
                    focus:ring-blue-500">
                <label for="femenino" class="ms-2 text-sm font-medium text-gray-900">Femenino</label>
            </div>
            <div class="flex items-center mb-3">
                <input
                    formControlName="sexo"
                    type="radio"
                    name="sexo"
                    id="masculino"
                    value="Masculino"
                    class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300
                    focus:ring-blue-500">

                <label for="masculino" class="ms-2 text-sm font-medium text-gray-900">Masculino</label>
            </div>
            <div class="flex justify-end mt-5">

                <button
                    type="submit"
                    class="text-white bg-blue-700 hover:bg-blue-800
                    focus:ring-4 focus:outline-none focus:ring-blue-300
                    font-medium rounded-lg text-sm px-5 py-2.5"
                    (click)="muestraZodiaco()">Imprimir</button>
            </div>
        </div>
    </form>

    <div class="mt-5">
        <h3 class="text-lg text-gray-900">
            Hola {{ zodiaco.nombre + ' ' + zodiaco.Apaterno + ' ' + zodiaco.Amaterno }} </h3>
        <h3 class="text-lg text-gray-900"> Tu edad es {{ edad }} años </h3>
        <h3 class="text-lg text-gray-900"> {{ horoscopo }} </h3>
        <img [src]="imagen" alt="Horoscopo" class="w-32 h-32">
    </div>
</div>
